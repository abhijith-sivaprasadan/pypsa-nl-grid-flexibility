name: Observed 2019 Dutch load-shape and line assumption experiment
on:
  push:
    branches: [research/observed-opsd-network-sensitivity-20261026]
    paths:
      - src/pypsa_nl_grid_flexibility/profiles.py
      - scripts/run_observed_line_sensitivity.py
      - .github/workflows/observed-opsd-lines.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-network-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_observed_opsd_alignment.py
      - name: Fetch dated public OPSD primary-derived package
        run: python scripts/download_opsd_profiles.py
      - name: Run six PyPSA reoptimisations against exact 2019 hours
        run: python scripts/run_observed_line_sensitivity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observed-2019-synthetic-grid-sensitivity
          path: runs/observed-2019-lines/
          if-no-files-found: warn
