[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa-nl-grid-flexibility"
version = "0.1.0"
description = "Reproducible PyPSA framework for grid-congestion and flexibility screening"
requires-python = ">=3.10"
authors = [{name = "Abhijith Sivaprasadan"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:You are using a Python version.*:FutureWarning:google\\.api_core\\._python_version_support",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
